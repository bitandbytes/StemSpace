[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stemspace"
dynamic = ["version"]
description = "Local MLX stem separation, spatial scene editing, and IAMF export"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "soundfile>=0.12,<1", "PyYAML>=6,<7"]

[project.optional-dependencies]
ui = ["PySide6-Essentials>=6.7,<7", "sounddevice>=0.5,<1", "soxr>=0.5,<2"]
mlx = ["mlx-audio-separator[convert]==0.1.20; sys_platform == 'darwin' and platform_machine == 'arm64'"]

[project.scripts]
stemspace = "stemspace.cli:main"

[tool.setuptools.dynamic]
version = {attr = "stemspace.__version__"}

[tool.setuptools.packages.find]
include = ["stemspace*"]

[tool.setuptools.package-data]
stemspace = ["cascade.yaml", "vendor/*", "vendor/decoder/wasm/*.wasm"]
